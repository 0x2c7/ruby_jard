plugins:
  - rubocop-rspec

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*.rb'
Lint/NonLocalExitFromIterator:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Style/SymbolArray:
  Enabled: false
Style/GuardClause:
  Enabled: false
Style/NumericPredicate:
  Enabled: false
Style/IfUnlessModifier:
  Enabled: false
Metrics/MethodLength:
  Max: 30
Metrics/PerceivedComplexity:
  Max: 15
Metrics/CyclomaticComplexity:
  Max: 15
Metrics/AbcSize:
  Enabled: false
Metrics/ParameterLists:
  Enabled: false
Metrics/ClassLength:
  Enabled: false
Layout/HashAlignment:
  Enabled: false
Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true
Layout/SpaceAroundMethodCallOperator:
  Enabled: true
Lint/DeprecatedOpenSSLConstant:
  Enabled: true
Lint/DuplicateElsifCondition:
  Enabled: true
Lint/MixedRegexpCaptureTypes:
  Enabled: true
Lint/RaiseException:
  Enabled: true
Lint/StructNewOverride:
  Enabled: true
Style/AccessorGrouping:
  Enabled: true
Style/ArrayCoercion:
  Enabled: true
Style/BisectedAttrAccessor:
  Enabled: true
Style/CaseLikeIf:
  Enabled: true
Style/ExponentialNotation:
  Enabled: true
Style/HashAsLastArrayItem:
  Enabled: true
Style/HashEachMethods:
  Enabled: true
Style/HashLikeCase:
  Enabled: true
Style/HashTransformKeys:
  Enabled: true
Style/HashTransformValues:
  Enabled: true
Style/RedundantAssignment:
  Enabled: true
Style/RedundantFetchBlock:
  Enabled: true
Style/RedundantFileExtensionInRequire:
  Enabled: true
Style/RedundantRegexpCharacterClass:
  Enabled: true
Style/RedundantRegexpEscape:
  Enabled: true
Style/SlicingWithRange:
  Enabled: true
Style/Alias:
  EnforcedStyle: prefer_alias_method
Style/EvalWithLocation:
  Enabled: false
Style/NilComparison:
  Enabled: false
Style/NonNilCheck:
  Enabled: false
Style/WordArray:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false
RSpec/ExampleLength:
  Enabled: false
RSpec/DescribeClass:
  Enabled: false
RSpec/NestedGroups:
  Max: 4
RSpec/MultipleMemoizedHelpers:
  Enabled: false

AllCops:
  TargetRubyVersion: 3.2
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    # Programs debugged by the integration specs. Their source is captured in
    # screen fixtures, so reformatting them would shift the recorded screens.
    - '**/*_example.rb'
    - 'spec/examples/**/*'
    - 'spec/integration/scenario_1/heap.rb'
    - 'spec/integration/scenario_1/list_node.rb'
    - 'spec/integration/scenario_1/merge_k_sorted_list.rb'
    - 'vendor/**/*'

# Integration specs assert through JardIntegrationTest#assert_screen, which
# this cop cannot recognise as an expectation.
RSpec/NoExpectationExample:
  Exclude:
    - 'spec/integration/**/*'
# Numbered symbols (e.g. `color_not_supported_1:`) are test-data keys.
Naming/VariableNumber:
  CheckSymbols: false
# Numbered lets (layout_1, thread_info_2) are a deliberate convention for
# specs comparing interchangeable fixtures.
RSpec/IndexedLet:
  Enabled: false
