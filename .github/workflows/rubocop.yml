name: RuboCop

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  rubocop:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Ruby
      uses: ruby/setup-ruby@v1
      with:
        # Oldest supported Ruby, matching TargetRubyVersion in .rubocop.yml.
        ruby-version: '3.2'
    - name: Install dependencies
      run: bundle install
    - name: Checking offenses
      run: bundle exec rubocop
